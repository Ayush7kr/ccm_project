{% extends 'base.html' %}

{% block title %}400 Bad Request — CCM{% endblock %}

{% block content %}
<div class="card empty-state" style="margin-top: 3rem; text-align: center; padding: 3rem 1.5rem;">
  <div class="empty-state-icon" style="background-color: var(--danger-light); color: var(--danger); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
    <i data-lucide="alert-octagon" style="width: 32px; height: 32px;"></i>
  </div>
  <h2 class="empty-state-title" style="font-size: 1.5rem; font-weight: 700;">Bad Request (400)</h2>
  <p class="empty-state-desc" style="max-width: 480px; margin: 0.5rem auto 1.5rem; color: var(--text-muted);">
    The request could not be understood by the server due to malformed syntax. Please verify your submission and try again.
  </p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary">
    <i data-lucide="arrow-left"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
