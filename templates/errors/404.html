{% extends 'base.html' %}

{% block title %}404 Page Not Found — CCM{% endblock %}

{% block content %}
<div class="card empty-state" style="margin-top: 3rem;">
  <div class="empty-state-icon" style="background-color: var(--danger-light); color: var(--danger);">
    <i data-lucide="compass" style="width: 32px; height: 32px;"></i>
  </div>
  <h2 class="empty-state-title" style="font-size: 1.5rem;">Page Not Found (404)</h2>
  <p class="empty-state-desc">The page or resource you requested could not be found or has been moved.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary">
    <i data-lucide="arrow-left"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
