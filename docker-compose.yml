version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ccm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ccm_db}
      POSTGRES_USER: ${DB_USER:-ccm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ccm_user} -d ${DB_NAME:-ccm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ccm_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - config.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER:-ccm_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-ccm_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:

